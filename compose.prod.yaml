name: sibima

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-app: &app
  build:
    context: .
    target: app
  image: sibima-app
  env_file: .env
  restart: unless-stopped
  logging: *logging
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    container_name: sibima-prod-app

  queue:
    <<: *app
    container_name: sibima-prod-queue
    command: php artisan queue:work database --sleep=3 --tries=1 --timeout=600 --max-time=3600 --memory=512

  scheduler:
    <<: *app
    container_name: sibima-prod-scheduler
    command: php artisan schedule:work

  web:
    build:
      context: .
      target: web
    image: sibima-web
    container_name: sibima-prod-web
    restart: unless-stopped
    logging: *logging
    # Tidak ada port host publik! Semua di-routing via gateway-network oleh NPM.
    depends_on:
      - app
    volumes:
      - storage:/var/www/html/storage:ro
    networks:
      - default
      - gateway-network

  db:
    image: mysql:8.4
    container_name: sibima-prod-db
    restart: unless-stopped
    logging: *logging
    command: --innodb-buffer-pool-size=512M --max-connections=50
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
  storage:

networks:
  default:
    name: sibima-internal
  gateway-network:
    external: true